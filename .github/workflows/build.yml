name: build-arbahi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arbahi-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: install
        run: npm install
      - name: fonts
        run: node scripts/fonts.mjs
      - name: signing key
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: android project
        run: |
          npx cap add android
          npx cap sync android
      - name: build apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: publish apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk arbahi.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest arbahi.apk --title "Arbahi APK" --notes "Download arbahi.apk and install it on the phone."

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fonts
        run: |
          npm install --no-save @fontsource-variable/cairo
          node scripts/fonts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
